name: GitHub Pages Yayını

# Site kökü statik olduğundan içerik gh-pages dalına aynen itilir.
# Depo ayarlarında: Settings → Pages → Source: "Deploy from a branch",
# Branch: gh-pages / (root). Bu ayar bir kez yapılır; sonrası otomatiktir.
on:
  push:
    branches:
      - main
      - master
      - claude/cumhuriyet-avukatlari-quiz-cards-3xdw03
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: gh-pages dalına yayınla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
