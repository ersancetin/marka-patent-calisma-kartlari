name: GitHub Pages Yayını

# Site kökü statik olduğundan içerik olduğu gibi Pages'e yüklenir.
# configure-pages adımı, depoda Pages kapalıysa etkinleştirir (enablement: true).
on:
  push:
    branches:
      - main
      - master
      - claude/cumhuriyet-avukatlari-quiz-cards-3xdw03
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Pages yapılandır
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Site içeriğini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
